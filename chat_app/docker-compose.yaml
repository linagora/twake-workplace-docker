services:

  synapse-init:
    image: busybox
    volumes:
      # Only the runtime data dir (gitignored), never the tracked config tree.
      # Synapse runs as 991 and needs this writable; scoping the chown here is
      # what stops it from rewriting the ownership of repo files.
      - ./synapse/data:/data
    command: sh -c "chown -R 991:991 /data && chmod -R u+rwX /data"
    restart: "no"
    networks:
      - twake-network

  synapse:
    image: matrixdotorg/synapse:v1.119.0
    restart: unless-stopped
    user: "root"
    entrypoint: ["/bin/sh", "-c", "update-ca-certificates && exec /start.py"]
    depends_on:
      - synapse-init
    environment:
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - SYNAPSE_CONFIG_PATH=/config/homeserver.yaml
    volumes:
      # Runtime data only (media, state); pre-chowned to 991 by synapse-init.
      - ./synapse/data:/data
      # Config lives outside /data so it is never chowned and keeps repo ownership.
      - ./synapse/homeserver-postgres.yaml:/config/homeserver.yaml:ro
      - ./synapse/matrix.signing.key:/config/matrix.signing.key:ro
      - ./synapse/matrix.log.config:/config/matrix.log.config:ro
      - ./tom-bridge/registration.yaml:/config/tom-bridge-registration.yaml:ro
      - ../twake_auth/traefik/ssl/root-ca.crt:/usr/local/share/ca-certificates/root-ca.crt:ro
    networks:
      - twake-network
    extra_hosts:
      - "auth.${BASE_DOMAIN}:172.27.0.100"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.synapse.rule=Host(`matrix.${BASE_DOMAIN}`)"
      - "traefik.http.routers.synapse.entrypoints=websecure"
      - "traefik.http.services.synapse.loadbalancer.server.port=8008"
      - "traefik.http.routers.matrixfromchat.rule=Host(`chat.${BASE_DOMAIN}`) && PathPrefix(`/_matrix`)"
      - "traefik.http.routers.matrixfromchat.entrypoints=websecure"
      - "traefik.http.routers.matrixfromchat.priority=100"

  tom:
    image: linagora/tom-server:2.0.1
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_started
    networks:
      - twake-network
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      # Rendered from tom/config.yaml.template by compose-wrapper.sh.
      - ./tom/config.yaml:/data/config.yaml:ro
    extra_hosts:
      - "matrix.${BASE_DOMAIN}:172.27.0.100"  
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tom.rule=Host(`tom.${BASE_DOMAIN}`)"
      - "traefik.http.routers.tom.entrypoints=websecure"
      - "traefik.http.services.tom.loadbalancer.server.port=3000"
      - "traefik.http.routers.tomfromchat.rule=Host(`chat.${BASE_DOMAIN}`) && PathPrefix(`/_twake`)"
      - "traefik.http.routers.tomfromchat.entrypoints=websecure"
      - "traefik.http.routers.tomfromchat.priority=100" 

  tom-bridge-init:
    image: matrixdotorg/synapse:v1.119.0
    restart: "no"
    depends_on:
      synapse:
        condition: service_started
    entrypoint: ["/bin/sh", "/ensure-bot-admin.sh"]
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN}
    volumes:
      - ./tom-bridge/ensure-bot-admin.sh:/ensure-bot-admin.sh:ro
      - ./tom-bridge/registration.yaml:/config/tom-bridge-registration.yaml:ro
    networks:
      - twake-network

  # Applies the user.settings.updated events of common-settings (display
  # name, avatar, email, phone) to the Matrix profiles.
  tom-bridge:
    image: linagora/tom-bridge:1.0.2
    restart: unless-stopped
    depends_on:
      tom-bridge-init:
        condition: service_completed_successfully
    volumes:
      # Rendered by compose-wrapper.sh.
      - ./tom-bridge/config.yaml:/data/config.yaml:ro
      - ./tom-bridge/registration.yaml:/data/registration.yaml:ro
    networks:
      - twake-network

  fed:
    image: linagora/tom-federated-identity-service:v2026-04-15
    restart: unless-stopped
    depends_on:
      tom:
        condition: service_started
    # To build from source instead of pulling the published image, uncomment:
    # build:
    #   context:  ./
    #   dockerfile: packages/federated-identity-service/Dockerfile
    # ports:
    #   - 3001:3001
    #   - 9229:9229
    networks:
      - twake-network
    environment:
      # - NODE_OPTIONS="--inspect=0.0.0.0:9229"
      - NODE_TLS_REJECT_UNAUTHORIZED=0

      - BASE_URL=https://fed.${BASE_DOMAIN}
      - SERVER_NAME=${BASE_DOMAIN}
      - TRUSTED_PROXIES=uniquelocal
      - TRUSTED_SERVERS_ADDRESSES=172.0.0.0/8

      - ADDITIONAL_FEATURES=true

      - CRON_SERVICE=true
      # - UPDATE_FEDERATED_IDENTITY_HASHES_CRON=0-59/2 * * * *
      # - UPDATE_USERS_CRON=1-59/2 * * * *

      - DATABASE_ENGINE=pg
      - DATABASE_HOST=postgres
      - DATABASE_NAME=fed
      - DATABASE_USER=twake
      - DATABASE_PASSWORD=twake!1

      ## For storing the federated identity raw users
      # - USERDB_ENGINE=ldap
      # - LDAP_URI=ldap://ldap
      # - LDAP_BASE=ou=users,dc=docker,dc=localhost
      # - LDAP_FILTER=(objectClass=inetOrgPerson)
      # - LDAP_USER=uid=fed,dc=docker,dc=localhost  ## Local LDAP is fully readable
      # - LDAP_PASSWORD=F3d_p@Ss                    ## Local LDAP is fully readable

      - LOG_LEVEL=silly
      - LOG_TRANSPORTS=Console
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fed.rule=Host(`fed.${BASE_DOMAIN}`)"
      - "traefik.http.routers.fed.entrypoints=websecure"
      - "traefik.http.services.fed.loadbalancer.server.port=3000"

  chat:
    image: linagora/twake-web
    restart: unless-stopped
    volumes:
      - ./chat/config.json:/usr/share/nginx/html/web/config.json
    networks:
      - twake-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat-redirect.rule=Host(`chat.${BASE_DOMAIN}`) && Path(`/`)"
      - "traefik.http.routers.chat-redirect.entrypoints=websecure"
      - "traefik.http.routers.chat-redirect.middlewares=chat-redirect"
      - "traefik.http.middlewares.chat-redirect.redirectregex.regex=^https://chat.${BASE_DOMAIN}/$"
      - "traefik.http.middlewares.chat-redirect.redirectregex.replacement=https://chat.${BASE_DOMAIN}/web/"
      - "traefik.http.middlewares.chat-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.chat.rule=Host(`chat.${BASE_DOMAIN}`) && PathPrefix(`/web`)"
      - "traefik.http.routers.chat.entrypoints=websecure"
      - "traefik.http.services.chat.loadbalancer.server.port=80"
      
networks:
  twake-network:
    external: true

