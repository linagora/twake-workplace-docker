uri=amqp://guest:guest@rabbitmq:5672

# RabbitMQ Administration Management
management.uri=http://rabbitmq:15672
management.user=guest
management.password=guest

scheduled.consumer.reconnection.enabled=true
scheduled.consumer.reconnection.interval=60s

# Twake Workplace settings (user.settings.updated from common-settings)
twp.rabbitmq.uri=amqp://guest:guest@rabbitmq:5672
twp.rabbitmq.management.uri=http://rabbitmq:15672
twp.settings.exchange=settings
twp.settings.routingKey=user.settings.updated
