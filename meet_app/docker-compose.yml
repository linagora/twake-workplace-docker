services:
  livekit:
    #    image: livekit/livekit-server:v1.13.7
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.livekit
    container_name: visio-livekit
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    restart: always
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7881:7881/udp"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.livekit.rule=Host(`livekit.${BASE_DOMAIN}`)"
      - "traefik.http.routers.livekit.entrypoints=websecure"
      - "traefik.http.routers.livekit.tls=true"
      - "traefik.http.services.livekit.loadbalancer.server.port=7880"
    networks:
      - twake-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:7880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Same images as the Twake Workplace staging (infra twake-workplace-apps,
  # chart lasuite-all-in-one 0.1.12): LaSuite Meet backend and LinTO frontend.
  # Transcription, summary and recording are disabled, as on staging.
  backend:
    image: lasuite/meet-backend:v1.13.0
    container_name: visio-backend
    platform: linux/amd64
    # The image USER ("1001:127:-1000") is not a valid docker user spec, which
    # breaks docker exec and the healthcheck.
    user: "1001:127"
    command:
      - /bin/sh
      - -c
      - python manage.py migrate --no-input && exec gunicorn -c /usr/local/etc/gunicorn/meet.py meet.wsgi:application
    environment:
      DJANGO_CONFIGURATION: Production
      DJANGO_SETTINGS_MODULE: meet.settings
      DJANGO_SILENCED_SYSTEM_CHECKS: security.W004, security.W008
      DJANGO_SECRET_KEY: ThisIsAnExampleKeyForDevPurposeOnly
      DJANGO_ALLOWED_HOSTS: meet.${BASE_DOMAIN},visio-backend,localhost
      ALLOWED_HOSTS: meet.${BASE_DOMAIN},visio-backend,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://meet.${BASE_DOMAIN}
      REDIS_URL: redis://:valkeypass@valkey:6379/1
      DJANGO_EMAIL_HOST: "mailcatcher"
      DJANGO_EMAIL_PORT: 1025
      DJANGO_EMAIL_DOMAIN: meet.${BASE_DOMAIN}
      DJANGO_EMAIL_APP_BASE_URL: https://meet.${BASE_DOMAIN}

      DB_HOST: postgres
      DB_NAME: meet
      DB_USER: visio
      DB_PASSWORD: visio
      DB_PORT: 5432

      STORAGES_STATICFILES_BACKEND: django.contrib.staticfiles.storage.StaticFilesStorage

      # Browsers and the backend both use this URL: traefik routes it to
      # LiveKit (signaling), media goes over UDP 7881 (see livekit.yaml).
      LIVEKIT_API_KEY: 9f3b2c7a8e6d4f1c
      LIVEKIT_API_SECRET: 6a9d0a3f5e4b8c2f9a7d6e3c1b4f8a2e
      LIVEKIT_API_URL: https://livekit.${BASE_DOMAIN}
      LIVEKIT_VERIFY_SSL: False
      ALLOW_UNREGISTERED_ROOMS: False
      ALLOW_UNSECURE_USER_LISTING: True
      RESOURCE_DEFAULT_ACCESS_LEVEL: public
      FRONTEND_SILENCE_LIVEKIT_DEBUG: False
      FRONTEND_USE_FRENCH_GOV_FOOTER: False
      FRONTEND_USE_PROCONNECT_BUTTON: False
      FRONTEND_IS_SILENT_LOGIN_ENABLED: True
      RECORDING_ENABLE: False
      ROOM_SUBTITLE_ENABLED: False

      OIDC_RP_CLIENT_ID: visio
      OIDC_RP_CLIENT_SECRET: visio-secret
      OIDC_RP_SCOPES: "openid email profile"
      OIDC_RP_SIGN_ALGO: RS256
      OIDC_OP_AUTHORIZATION_ENDPOINT: https://auth.${BASE_DOMAIN}/oauth2/authorize
      OIDC_OP_TOKEN_ENDPOINT: https://auth.${BASE_DOMAIN}/oauth2/token
      OIDC_OP_USER_ENDPOINT: https://auth.${BASE_DOMAIN}/oauth2/userinfo
      OIDC_OP_JWKS_ENDPOINT: https://auth.${BASE_DOMAIN}/oauth2/jwks
      OIDC_OP_LOGOUT_ENDPOINT: https://auth.${BASE_DOMAIN}/oauth2/logout
      OIDC_REDIRECT_ALLOWED_HOSTS: https://meet.${BASE_DOMAIN}
      OIDC_REDIRECT_REQUIRE_HTTPS: True
      OIDC_VERIFY_SSL: False
      LOGIN_REDIRECT_URL: /
      LOGIN_REDIRECT_URL_FAILURE: /
      LOGOUT_REDIRECT_URL: /
    restart: always
    extra_hosts:
      - "auth.${BASE_DOMAIN}:172.27.0.100"
      - "livekit.${BASE_DOMAIN}:172.27.0.100"
    labels:
      - "traefik.enable=false"
    networks:
      - twake-network
    depends_on:
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/api/v1.0/config/', headers={'X-Forwarded-Proto': 'https'}))\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    image: ghcr.io/linto-ai/meet-frontend:71b86651
    container_name: visio-frontend
    platform: linux/amd64
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      VITE_API_BASE_URL: https://meet.${BASE_DOMAIN}/
    restart: always
    networks:
      - twake-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meet.rule=Host(`meet.${BASE_DOMAIN}`)"
      - "traefik.http.services.meet.loadbalancer.server.port=8080"

networks:
  twake-network:
    external: true
