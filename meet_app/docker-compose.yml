services:
  livekit:
    #    image: livekit/livekit-server:v1.13.10
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.livekit
    container_name: visio-livekit
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    restart: always
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7881:7881/udp"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.livekit.rule=Host(`livekit.${BASE_DOMAIN}`)"
      - "traefik.http.routers.livekit.entrypoints=websecure"
      - "traefik.http.routers.livekit.tls=true"
      - "traefik.http.services.livekit.loadbalancer.server.port=7880"
    networks:
      - twake-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:7880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LinTO's fork of Meet, which uploads the screen recordings to the owner's
  # Drive. Transcription and summary are disabled.
  backend:
    image: ghcr.io/linto-ai/meet-backend:v1.42
    container_name: visio-backend
    platform: linux/amd64
    command:
      - /bin/sh
      - -c
      # The Application of calendar_app's side service, which creates the Meet
      # rooms of the events through the external API (secret hashed on save),
      # acting only for the users of MAIL_DOMAIN
      - >-
        python manage.py migrate --no-input &&
        python manage.py shell -c "import os; from core.models import Application, ApplicationDomain;
        app, _ = Application.objects.get_or_create(client_id=os.environ['CALENDAR_APPLICATION_CLIENT_ID'],
        defaults={'name': 'Twake Calendar'});
        app.scopes = ['rooms:create', 'rooms:list', 'rooms:retrieve', 'rooms:update'];
        app.client_secret = os.environ['CALENDAR_APPLICATION_CLIENT_SECRET']; app.save();
        ApplicationDomain.objects.get_or_create(application=app, domain=os.environ['CALENDAR_APPLICATION_DOMAIN'].lower())" &&
        exec gunicorn -c /usr/local/etc/gunicorn/meet.py meet.wsgi:application
    environment: &backend-environment
      DJANGO_CONFIGURATION: Production
      DJANGO_SETTINGS_MODULE: meet.settings
      DJANGO_SILENCED_SYSTEM_CHECKS: security.W004, security.W008
      DJANGO_SECRET_KEY: ThisIsAnExampleKeyForDevPurposeOnly
      DJANGO_ALLOWED_HOSTS: meet.${BASE_DOMAIN},visio-backend,visio-frontend,localhost
      ALLOWED_HOSTS: meet.${BASE_DOMAIN},visio-backend,visio-frontend,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://meet.${BASE_DOMAIN}
      REDIS_URL: redis://:valkeypass@valkey:6379/1
      DJANGO_EMAIL_HOST: tmail-backend
      DJANGO_EMAIL_PORT: 25
      DJANGO_EMAIL_FROM: noreply@${MAIL_DOMAIN}
      DJANGO_EMAIL_DOMAIN: meet.${BASE_DOMAIN}
      DJANGO_EMAIL_APP_BASE_URL: https://meet.${BASE_DOMAIN}

      DB_HOST: postgres
      DB_NAME: meet
      DB_USER: visio
      DB_PASSWORD: visio
      DB_PORT: 5432

      STORAGES_STATICFILES_BACKEND: django.contrib.staticfiles.storage.StaticFilesStorage

      # Browsers and the backend both use this URL: traefik routes it to
      # LiveKit (signaling), media goes over UDP 7881 (see livekit.yaml).
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env (openssl rand -hex 16)}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env (openssl rand -hex 32)}
      LIVEKIT_API_URL: https://livekit.${BASE_DOMAIN}
      LIVEKIT_VERIFY_SSL: False
      ALLOW_UNREGISTERED_ROOMS: False
      ALLOW_UNSECURE_USER_LISTING: True
      RESOURCE_DEFAULT_ACCESS_LEVEL: public
      FRONTEND_SILENCE_LIVEKIT_DEBUG: False
      FRONTEND_USE_FRENCH_GOV_FOOTER: False
      FRONTEND_USE_PROCONNECT_BUTTON: False
      FRONTEND_IS_SILENT_LOGIN_ENABLED: True
      ROOM_SUBTITLE_ENABLED: False

      # LiveKit egress writes the recording to the bucket, the celery beat
      # polls the bucket for it, then the worker uploads it to the owner's
      # Drive (Meetings folder) and emails them.
      RECORDING_ENABLE: True
      RECORDING_WORKER_CLASSES: '{"screen_recording":"core.recording.worker.services.VideoCompositeEgressService"}'
      RECORDING_STORAGE_POLLING_ENABLED: True
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_ACCESS_KEY_ID: vW9xY2zA5bC8dE1fG4hJ3kL
      AWS_S3_SECRET_ACCESS_KEY: hJ6kL9mN2pQ5rS8tU1vW4xY7zA0bC3dE6fG9hJ2kL
      AWS_S3_REGION_NAME: us-east-1
      AWS_STORAGE_BUCKET_NAME: meet-media-storage
      CELERY_ENABLED: True
      CELERY_BROKER_URL: redis://:valkeypass@valkey:6379/2
      # drive-token stands in for the Cloudery; the instance comes from the
      # workplaceFqdn claim LemonLDAP sends.
      CLOUDERY_URL: http://meet-drive-token:8080
      CLOUDERY_TOKEN: meet-drive-token-dev
      OIDC_USERINFO_TWAKE_INSTANCE_FIELD: workplaceFqdn
      TWAKE_INSTANCE_DOMAIN: ${BASE_DOMAIN}
      # The Drive upload (aiohttp) checks the instance certificate.
      SSL_CERT_FILE: /etc/ssl/certs/root-ca.crt

      EXTERNAL_API_ENABLED: True
      # Signs the tokens of the external API, which meet.${BASE_DOMAIN} serves
      APPLICATION_JWT_SECRET_KEY: ${MEET_APPLICATION_JWT_SECRET_KEY:?set MEET_APPLICATION_JWT_SECRET_KEY in .env (openssl rand -hex 32)}
      APPLICATION_BASE_URL: https://meet.${BASE_DOMAIN}
      # Same as meet.application.* in calendar_app/conf-side-service
      CALENDAR_APPLICATION_CLIENT_ID: twake-calendar
      CALENDAR_APPLICATION_CLIENT_SECRET: ${CALENDAR_MEET_CLIENT_SECRET:?set CALENDAR_MEET_CLIENT_SECRET in .env (openssl rand -hex 32)}
      CALENDAR_APPLICATION_DOMAIN: ${MAIL_DOMAIN}

      OIDC_RP_CLIENT_ID: visio
      OIDC_RP_CLIENT_SECRET: visio-secret
      OIDC_RP_SCOPES: "openid email profile"
      OIDC_RP_SIGN_ALGO: RS256
      OIDC_OP_AUTHORIZATION_ENDPOINT: https://auth.${BASE_DOMAIN}/oauth2/authorize
      OIDC_OP_TOKEN_ENDPOINT: https://auth.${BASE_DOMAIN}/oauth2/token
      OIDC_OP_USER_ENDPOINT: https://auth.${BASE_DOMAIN}/oauth2/userinfo
      OIDC_OP_JWKS_ENDPOINT: https://auth.${BASE_DOMAIN}/oauth2/jwks
      OIDC_OP_LOGOUT_ENDPOINT: https://auth.${BASE_DOMAIN}/oauth2/logout
      OIDC_REDIRECT_ALLOWED_HOSTS: https://meet.${BASE_DOMAIN}
      OIDC_REDIRECT_REQUIRE_HTTPS: True
      OIDC_VERIFY_SSL: False
      LOGIN_REDIRECT_URL: /
      LOGIN_REDIRECT_URL_FAILURE: /
      LOGOUT_REDIRECT_URL: /
    restart: always
    # The Drive instances of the users and of the demo organization, as in
    # cozy_stack.
    extra_hosts: &backend-extra-hosts
      - "auth.${BASE_DOMAIN}:172.27.0.100"
      - "livekit.${BASE_DOMAIN}:172.27.0.100"
      - "user1.${BASE_DOMAIN}:172.27.0.100"
      - "user2.${BASE_DOMAIN}:172.27.0.100"
      - "user3.${BASE_DOMAIN}:172.27.0.100"
      - "${ORGANIZATION_ID}.${BASE_DOMAIN}:172.27.0.100"
      - "${ORGANIZATION_ID}1.${BASE_DOMAIN}:172.27.0.100"
      - "${ORGANIZATION_ID}2.${BASE_DOMAIN}:172.27.0.100"
      - "${ORGANIZATION_ID}3.${BASE_DOMAIN}:172.27.0.100"
    volumes: &backend-volumes
      - ./config/root-ca.crt:/etc/ssl/certs/root-ca.crt:ro
    labels:
      - "traefik.enable=false"
    networks:
      - twake-network
    depends_on:
      livekit:
        condition: service_healthy
      meet-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/api/v1.0/config/', headers={'X-Forwarded-Proto': 'https'}))\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Runs the recording tasks, and the beat that polls the bucket for finished
  # recordings.
  celery:
    image: ghcr.io/linto-ai/meet-backend:v1.42
    container_name: visio-celery
    platform: linux/amd64
    command: ["celery", "-A", "meet.celery_app", "worker", "--beat", "-l", "INFO", "--pool=solo"]
    environment: *backend-environment
    extra_hosts: *backend-extra-hosts
    volumes: *backend-volumes
    restart: always
    labels:
      - "traefik.enable=false"
    networks:
      - twake-network
    depends_on:
      backend:
        condition: service_healthy

  egress:
    image: livekit/egress:v1.15.0
    container_name: visio-egress
    platform: linux/amd64
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
        api_secret: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
        ws_url: ws://livekit:7880
        # Lets the recorder's Chrome join over ws:// from the https composite template.
        insecure: true
        redis:
          address: valkey:6379
          password: valkeypass
        health_port: 9090
        log_level: info
    # Chrome's sandbox, which renders the room composite.
    cap_add:
      - SYS_ADMIN
    restart: always
    labels:
      - "traefik.enable=false"
    networks:
      - twake-network
    depends_on:
      livekit:
        condition: service_healthy

  meet-bucket:
    image: bitnamilegacy/minio:2025.4.22
    container_name: visio-bucket
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set twake http://minio:9000 vW9xY2zA5bC8dE1fG4hJ3kL hJ6kL9mN2pQ5rS8tU1vW4xY7zA0bC3dE6fG9hJ2kL &&
        mc mb --ignore-existing twake/meet-media-storage
    restart: "no"
    labels:
      - "traefik.enable=false"
    networks:
      - twake-network

  meet-drive-token:
    image: python:3.13-alpine
    container_name: visio-drive-token
    command: ["python", "/app/server.py"]
    environment:
      COZY_ADMIN_URL: http://cozyt:6060
      COZY_ADMIN_PASSPHRASE: ${COZY_ADMIN_PASSPHRASE:-admin}
      DRIVE_TOKEN_SECRET: meet-drive-token-dev
      BASE_DOMAIN: ${BASE_DOMAIN}
    volumes:
      - ./drive-token/server.py:/app/server.py:ro
    restart: always
    labels:
      - "traefik.enable=false"
    networks:
      - twake-network

  frontend:
    image: ghcr.io/linto-ai/meet-frontend:v1.42
    container_name: visio-frontend
    platform: linux/amd64
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      VITE_API_BASE_URL: https://meet.${BASE_DOMAIN}/
    restart: always
    networks:
      - twake-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meet.rule=Host(`meet.${BASE_DOMAIN}`)"
      - "traefik.http.services.meet.loadbalancer.server.port=8080"

networks:
  twake-network:
    external: true
