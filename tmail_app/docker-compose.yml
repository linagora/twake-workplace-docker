networks:
  twake-network:
    external: true

services:
  # ==================== Search Engine ====================
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: opensearch
    hostname: opensearch
    restart: always
    networks:
      - twake-network
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx768m
      - cluster.name=opensearch
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - cluster.routing.allocation.disk.watermark.low=99%
      - cluster.routing.allocation.disk.watermark.high=99%
      - cluster.routing.allocation.disk.watermark.flood_stage=100%
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    labels:
      - "traefik.enable=false"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
  # ==================== TMail Backend ====================
  tmail-backend:
    image: linagora/tmail-backend:distributed-1.0.19.1
    container_name: tmail-backend
    hostname: tmail-backend
    restart: always
    networks:
      - twake-network
    #ports:
    #- "25:25"       # SMTP
    #- "143:143"     # IMAP
    #- "465:465"     # SMTPS
    #- "587:587"     # SMTP Submission
    #- "993:993"     # IMAPS
    volumes:
      - ./config:/root/conf
      - ./extensions-jars:/root/extensions-jars
      - ./secrets:/root/secrets
    depends_on:
      opensearch:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Define services explicitly (solves "too many services" error)
      - "traefik.http.services.tmail-jmap.loadbalancer.server.port=9081"
      - "traefik.http.services.tmail-webadmin.loadbalancer.server.port=8000"
      # OIDC discovery → LemonLDAP (highest priority)
      - "traefik.http.routers.mail-backend-oidc.rule=Host(`jmap.${BASE_DOMAIN}`) && Path(`/.well-known/openid-configuration`)"
      - "traefik.http.routers.mail-backend-oidc.entrypoints=websecure"
      - "traefik.http.routers.mail-backend-oidc.tls=true"
      - "traefik.http.routers.mail-backend-oidc.priority=1000"
      - "traefik.http.routers.mail-backend-oidc.service=lemonldap"
      - "traefik.http.routers.mail-backend-oidc.middlewares=lemonldap-host"

      # WebFinger with OpenID query → LemonLDAP (priority 400)
      - "traefik.http.routers.mail-backend-webfinger-openid.rule=Host(`jmap.${BASE_DOMAIN}`) && Path(`/.well-known/webfinger`) && Query(`rel=http://openid.net/specs/connect/1.0/issuer`)"
      - "traefik.http.routers.mail-backend-webfinger-openid.entrypoints=websecure"
      - "traefik.http.routers.mail-backend-webfinger-openid.tls=true"
      - "traefik.http.routers.mail-backend-webfinger-openid.priority=400"
      - "traefik.http.routers.mail-backend-webfinger-openid.service=lemonldap"
      - "traefik.http.routers.mail-backend-webfinger-openid.middlewares=lemonldap-host"

      # JMAP .well-known/jmap endpoint (priority 500)
      - "traefik.http.routers.mail-backend-jmap-wellknown.rule=Host(`jmap.${BASE_DOMAIN}`) && Path(`/.well-known/jmap`)"
      - "traefik.http.routers.mail-backend-jmap-wellknown.entrypoints=websecure"
      - "traefik.http.routers.mail-backend-jmap-wellknown.tls=true"
      - "traefik.http.routers.mail-backend-jmap-wellknown.middlewares=cors-headers@file"
      - "traefik.http.routers.mail-backend-jmap-wellknown.priority=500"
      - "traefik.http.routers.mail-backend-jmap-wellknown.service=tmail-jmap"

      # JMAP /jmap endpoints (priority 300)
      - "traefik.http.routers.mail-backend-jmap.rule=Host(`jmap.${BASE_DOMAIN}`) && PathPrefix(`/jmap`)"
      - "traefik.http.routers.mail-backend-jmap.entrypoints=websecure"
      - "traefik.http.routers.mail-backend-jmap.tls=true"
      - "traefik.http.routers.mail-backend-jmap.middlewares=cors-headers@file"
      - "traefik.http.routers.mail-backend-jmap.priority=300"
      - "traefik.http.routers.mail-backend-jmap.service=tmail-jmap"

      # WebFinger default (non-OpenID queries) → TMail Backend (priority 200)
      - "traefik.http.routers.mail-backend-webfinger.rule=Host(`jmap.${BASE_DOMAIN}`) && Path(`/.well-known/webfinger`)"
      - "traefik.http.routers.mail-backend-webfinger.entrypoints=websecure"
      - "traefik.http.routers.mail-backend-webfinger.tls=true"
      - "traefik.http.routers.mail-backend-webfinger.middlewares=cors-headers@file"
      - "traefik.http.routers.mail-backend-webfinger.priority=200"
      - "traefik.http.routers.mail-backend-webfinger.service=tmail-jmap"

      # WebAdmin API (fallback, lowest priority)
      - "traefik.http.routers.mail-backend-webadmin.rule=Host(`jmap.${BASE_DOMAIN}`) && PathPrefix(`/`)"
      - "traefik.http.routers.mail-backend-webadmin.entrypoints=websecure"
      - "traefik.http.routers.mail-backend-webadmin.tls=true"
      - "traefik.http.routers.mail-backend-webadmin.middlewares=cors-headers@file"
      - "traefik.http.routers.mail-backend-webadmin.priority=1"
      - "traefik.http.routers.mail-backend-webadmin.service=tmail-webadmin"
      # Middleware definitions
      - "traefik.http.middlewares.lemonldap-host.headers.customRequestHeaders.Host=jmap.${BASE_DOMAIN}"
    environment:
      - JAVA_TOOL_OPTIONS=
        -Xms2000m
        -Xmx2000m
        -XX:+AlwaysPreTouch
        -XX:+ExitOnOutOfMemoryError
        -Xlog:gc*:file=/root/gc.log
        -XX:MaxGCPauseMillis=20
        -XX:ParallelGCThreads=2
        -Djames.protocols.mdc.hostname=false
        -Dextra.props=/root/conf/jvm.properties

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -s -o /dev/null 'http://localhost:8000/healthcheck?check=IMAPHealthCheck&check=Cassandra%20backend&check=RabbitMQ%20backend&strict'",
        ]
      interval: 60s
      timeout: 30s
      retries: 3

  # ==================== TMail Web UI ====================
  tmail-web:
    image: linagora/tmail-web:v0.30.0
    container_name: tmail-web
    hostname: tmail-web
    restart: always
    networks:
      - twake-network
    volumes:
      - ./tmail-web-conf/.env:/usr/share/nginx/html/assets/env.file
      - ./tmail-web-conf/env.fcm:/usr/share/nginx/html/assets/configurations/env.fcm
      - ./tmail-web-conf/app_dashboard.json:/usr/share/nginx/html/assets/configurations/app_dashboard.json
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mail-front.rule=Host(`mail.${BASE_DOMAIN}`)"
    depends_on:
      - tmail-backend

  # ==================== Twake Mail (React) ====================
  # The React Twake Mail (github.com/Crash--/twake-mail-frontend) on
  # mail-react.${BASE_DOMAIN}, with the team mailbox facade that Twake Space
  # frames. The default image is the one it is to be published as; until then
  # set TWAKE_MAIL_REACT_IMAGE. Only started with the mail-react profile
  # (COMPOSE_PROFILES in .env).
  tmail-web-react:
    image: ${TWAKE_MAIL_REACT_IMAGE:-ghcr.io/linagora/twake-mail-frontend:0.1.0}
    profiles: [mail-react]
    container_name: tmail-web-react
    restart: unless-stopped
    user: "101"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - twake-network
    volumes:
      - ./tmail-web-react/env.js:/usr/share/nginx/html/.env.js:ro
    environment:
      LISTEN_PORT: "8080"
      # The SSO, and each user's Cozy for the Drive picker
      CSP_CONNECT_SRC: "https://*.${BASE_DOMAIN}"
      CSP_FRAME_SRC: "https://*.${BASE_DOMAIN}"
      # Framed by the Cozy Mail app and by Twake Space
      CSP_FRAME_ANCESTORS: "'self' https://*.${BASE_DOMAIN}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      # Above the router of the Cozy instances (*.${BASE_DOMAIN})
      - "traefik.http.routers.mail-react.rule=Host(`mail-react.${BASE_DOMAIN}`)"
      - "traefik.http.routers.mail-react.entrypoints=websecure"
      - "traefik.http.routers.mail-react.tls=true"
      - "traefik.http.routers.mail-react.priority=100"
      - "traefik.http.routers.mail-react.service=mail-react"
      - "traefik.http.services.mail-react.loadbalancer.server.port=8080"
      # JMAP on the same origin, no CORS: the prefix headers make tmail-backend
      # advertise URLs of this host in the JMAP session
      # (dynamic.jmap.prefix.resolution.enabled in jmap.properties)
      - "traefik.http.routers.mail-react-jmap.rule=Host(`mail-react.${BASE_DOMAIN}`) && (PathPrefix(`/jmap`) || PathPrefix(`/upload`) || PathPrefix(`/download`) || PathPrefix(`/eventSource`) || Path(`/.well-known/jmap`))"
      - "traefik.http.routers.mail-react-jmap.entrypoints=websecure"
      - "traefik.http.routers.mail-react-jmap.tls=true"
      - "traefik.http.routers.mail-react-jmap.priority=200"
      - "traefik.http.routers.mail-react-jmap.service=tmail-jmap"
      - "traefik.http.routers.mail-react-jmap.middlewares=mail-react-jmap-prefix"
      - "traefik.http.middlewares.mail-react-jmap-prefix.headers.customrequestheaders.X-JMAP-PREFIX=https://mail-react.${BASE_DOMAIN}"
      - "traefik.http.middlewares.mail-react-jmap-prefix.headers.customrequestheaders.X-JMAP-WEBSOCKET-PREFIX=wss://mail-react.${BASE_DOMAIN}"
    depends_on:
      - tmail-backend

  # ==================== phpLDAPadmin (LDAP UI) ====================
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin
    hostname: phpldapadmin
    restart: always
    networks:
      - twake-network
    #ports:
    #- "8081:80"  # Access UI on http://localhost:8081
    environment:
      - "PHPLDAPADMIN_HTTPS=false"
      - "PHPLDAPADMIN_LDAP_CLIENT_TLS_REQCERT=never"
      - "PHPLDAPADMIN_TRUST_PROXY_SSL=true"
      - "PHPLDAPADMIN_LDAP_HOSTS=#PYTHON2BASH:[{ 'ldap' : [ { 'server' : [ { 'tls': False }, { 'port' : 389 } ] }, { 'login' : [ { 'bind_id' : 'cn=admin,${LDAP_BASE_DN}' } ] } ] }]"

volumes:
  opensearch_data:
    driver: local
