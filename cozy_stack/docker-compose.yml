services:
  cozy-stack:
    image: cozy/cozy-stack:1.6.50-rc1
    platform: linux/amd64
    container_name: cozyt
    restart: unless-stopped

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cozy.rule=HostRegexp(`{subdomain:[a-z0-9-]+}.${BASE_DOMAIN}`)"
      - "traefik.http.routers.cozy.priority=1"
      - "traefik.http.routers.cozy.entrypoints=websecure"
      - "traefik.http.routers.cozy.tls=true"
      - "traefik.http.services.cozy.loadbalancer.server.port=8080"
    environment:
      COUCHDB_HOST: couchdb
      COUCHDB_USER: admin
      BASE_DOMAIN: ${BASE_DOMAIN}
      COUCHDB_PASSWORD: password
      COZY_ADMIN_PASSPHRASE: ${COZY_ADMIN_PASSPHRASE:-admin}
      INBOX_SECRET: secret
      OUTBOX_SECRET: secret
    extra_hosts:
      - "auth.${BASE_DOMAIN}:172.27.0.100"
    volumes:
      - cozy-data:/var/lib/cozy/
      - ./config/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
      - ./config/cozy.yaml:/etc/cozy/cozy.yaml
      - ../twake_auth/traefik/ssl/root-ca.crt:/usr/local/share/ca-certificates/root-ca.crt
      - ./config/create-shortcut.sh:/usr/local/bin/create-shortcut.sh
      #- ./config/change-features.sh:/usr/local/bin/change-features.sh
      #- ./config/example-features.json:/usr/local/bin/example-features.json
      - ./config/example-shortcut.json:/usr/local/bin/example-shortcut.json
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '[ "$(curl -fsSL http://localhost:8080/status | jq -r .status)" = "OK" ] || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks:
      - twake-network
  patcher-cozy:
    image: docker:26-cli
    container_name: patcher-cozy
    networks:
      - twake-network

    depends_on:
      - cozy-stack
    environment:
      - CONTAINER=cozyt
      - ENABLE_APPS="mail,linshare,chat,calendar,meet,calendar-v2,contacts"
      - BASE_DOMAIN=${BASE_DOMAIN}
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    restart: "no"
volumes:
  cozy-data:
    driver: local
networks:
  twake-network:
    external: true
